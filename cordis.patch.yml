# Chat backgrounds — the bundle row installed by install.ps1 (pnpm pack +
# `dsh plugin add`). The row id is the client configForms namespace; the
# `plugins.bundle.config` slot is keyed by the package name `dsh-background`.
# Defaults mirror a fresh install; install.ps1 may rewrite them from the
# legacy settings.yaml section before packing so user values survive the port.
- insert:
  - id: chat-background
    name: dsh-background
    config:
      language: auto
      panelTransparency: 30
